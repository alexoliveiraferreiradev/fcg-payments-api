apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payment-api-deployment
  labels:
    app: fcg-payment-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fcg-payment-api
  template:
    metadata:
      labels: 
        app: fcg-payment-api
      annotations:
        autor: Alex O Ferreira
        description: "Deployment do microsservico de Pagamentos API do Fiap Cloud Games"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fcg-payment-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: c-fcg-payments-api
        image: acrfiapcloudgames.azurecr.io/fcg-payments-api:1.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
          - name: AzureServiceBus__ConnectionString
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: ServiceBus_Connection
          - name: AzureServiceBus__PaymentOrderQueue
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: PAYMENT_ORDER_QUEUE
          - name: AzureServiceBus__PaymentDeliveryFailedQueue
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: PAYMENT_DELIVERY_FAILED_QUEUE
          - name: DatabaseSettings__Host
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: DB_SERVER
          - name: DatabaseSettings__DatabaseName
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: DB_NAME
          - name: DatabaseSettings__Port
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: DB_PORT          
          - name: ASPNETCORE_ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: ENVIRONMENT          
          - name: DatabaseSettings__Username
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_USER
          - name: DatabaseSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_PASS 
          - name: K8S_MASSTELEMETRY
            valueFrom:
              configMapKeyRef:
                name: payment-config
                key: MASSTRANSIT_USAGE_TELEMETRY    
        volumeMounts:
          - name: secrets-store
            mountPath: /mnt/secrets
            readOnly: true
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-kv                         
        
---
apiVersion: v1
kind: Service
metadata:
  name: svc-payment-service
spec:
  type: ClusterIP
  selector: 
    app: fcg-payment-api
  ports:
    - port: 8083
      targetPort: 8080          